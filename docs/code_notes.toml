# ---- consistency.py: v4 deterministic oracles
"consistency.Facts" = "What the audit script read from a page: URL, h1, title, visible and plain text, lists (heading, items, nav flag), counts, times, tables, links, form state."
"consistency.Facts.of" = "Builds Facts from the audit script's raw result."
"consistency.Facts.content_lists" = "Lists that are content, not navigation (menus, tab bars, pagination excluded, D54)."
"consistency.Facts.main_list" = "The largest content list on the page (search results, feeds)."
"consistency.audit" = "Runs the page-audit script (AUDIT_JS) on the worker's page or a probe tab and returns its Facts."
"consistency.Violation" = "One rule violation: rule id, subject (what it is about), message and evidence."
"consistency.Violation.tier" = "The rule's tier: T1 definite, T2 likely, T3 LLM-cited."
"consistency.signal_of" = "Turns a Violation into a `consistency` Signal whose signature is rule + route shape + subject (I45), so the store deduplicates it and the gate can match it."
"consistency._unit" = "Normalised unit of a count ('Books' -> 'book') so counts and lists can be matched."
"consistency._close" = "Whether two money amounts are equal within rounding."
"consistency.item_matches" = "Whether a list item is a given object (same link target, same name, or the name inside its text)."
"consistency.diff_lists" = "Items added and removed between two snapshots of one list."
"consistency.explained" = "Whether some recorded action (create, delete, toggle ...) on that item explains why a list changed."
"consistency.apply_template" = "Builds an item's edit address from its page address using a learned template (R13)."
"consistency.SweepState.__init__" = "Creates the shared memory and the per-run caches and counters (link statuses, probes, access evidence, mutation forms, reload pages)."
"consistency.Sweeper.__init__" = "Creates one worker's sweeper over the shared state; `llm_rules` turns on the rule that uses the model's cited contradictions (R15)."
"consistency.Sweeper.before" = "Before a step's actions: marks the control about to be clicked and reads its text, number, the item it sits in, form validity and the page text (PRE_JS)."
"consistency.Sweeper.after" = "After a step's actions: audits the page, records a memory event, and runs every rule (junk, links, counts, arithmetic, echo, effects, pending checks, lists, ages, link vs destination, pagination, back, probes, mutation, access, reload); returns the violations as signals."
"consistency.Sweeper._event" = "Works out what the step did (verb from the model's intent or from word lists over the clicked control; object; fields; whether the app accepted a write) and records it in the action ledger."
"consistency.Sweeper._effects" = "Immediate-effect rules: I-submit (a valid form sent nothing and nothing changed), I-error (a system error after a save), toggle counts that move the wrong way."
"consistency.Sweeper._verify_pending" = "Deferred checks of earlier intents: I-create/I-edit (the object is shown where the flow landed or started), I-delete (gone when its address is opened in a fresh tab), search/filter and logout checks."
"consistency.Sweeper._filter_check" = "I-filter: every result of a filter or search for T must contain T, on the list or on its own page."
"consistency.Sweeper._logout_check" = "I-logout: after logging out, a page that showed the account name must no longer show it."
"consistency.Sweeper._lists" = "List rules: R07/R07b (what this worker favourited or followed must be in that list) and R09 (a list changed on a revisit with no recorded action to explain it)."
"consistency.Sweeper._probes" = "R02 broken link: checks the status of a few list-item links (404/5xx is a violation); runs the R05 search probe."
"consistency.Sweeper._access" = "R13 access: an item page's Edit link refused for this session while the same kind of edit address worked, or a hidden Edit whose address still opens the filled form."
"consistency.Sweeper._probe_form" = "Opens an edit address in a fresh tab and reports whether it shows a form filled with the item's data (R13 evidence)."
"consistency.Sweeper._reload" = "G2 reload invariance: after a plain navigation, opens the same URL in a fresh tab and compares heading, lists and counts (view_diff)."
"consistency.Sweeper._mutate" = "R16/R17: after an accepted one-step create form, submits it again in fresh tabs with an empty, spaces-only and over-long name and checks how the app answers."
"consistency.Sweeper._fresh_text" = "Visible text of a URL in a fresh tab (counts against the per-step probe budget)."
"consistency.Sweeper._fetch" = "HTTP GET through the worker's session (link status checks); returns status and optionally the body."
"consistency._quiet" = "Waits until a probe page's network is idle."
"consistency._ProbeNet.__init__" = "Attaches request/response listeners to a probe tab."
"consistency._ProbeNet._request" = "Tracks a probe tab's in-flight request."
"consistency._ProbeNet._finished" = "Marks a probe tab's request as finished."
"consistency._ProbeNet._response" = "Records a probe tab's write statuses and 5xx answers."
"consistency._ProbeNet.reset" = "Clears what was recorded before the next submission."
"consistency._locate" = "Finds an element by key and ordinal in a list of elements."
"consistency._href_of" = "Extracts the href from an element description."
"consistency._el_text" = "Extracts the quoted visible text from an element description."

