# ---- appctl.py: the app under test
"appctl.AppControlError" = "Raised when a docker compose command fails or the app does not become healthy."
"appctl.AppControl" = "Starts, stops, resets and health-checks the app under test (Conduit or BookStack) through docker compose."
"appctl.AppControl.__init__" = "Binds the controller to one app's compose folder from its config."
"appctl.AppControl._compose" = "Runs one `docker compose` command in the app's folder and returns its output; raises AppControlError on failure."
"appctl.AppControl._client_faults_file" = "Path of the file that records which client-side (injected) faults are switched on for BookStack."
"appctl.AppControl._backend_up" = "Whether the backend container is running (Conduit's faults are read from it)."
"appctl.AppControl.up" = "Starts the app with a given fault set (FAULTS env for Conduit, the enabled-faults file for BookStack), waits until healthy and, for BookStack, waits for the seed-loader to finish."
"appctl.AppControl.wait_healthy" = "Polls the app's health URL until it answers 200 or the timeout passes."

# ---- browser.py: Playwright layer
"browser.Element" = "One interactive element the agent can act on: id, tag, type, role, visible text, label, href, value, options, disabled/active flags."
"browser.Element.describe" = "One-line description of the element for the LLM prompt, e.g. `[12] button \"Post Comment\"`."
"browser.Observation" = "What a worker sees at one step: URL, title, interactive elements (up to 80), the text-free DOM skeleton and the visible text."
"browser.Observation.element" = "Looks up an element of this observation by its id."
"browser.ActionResult" = "Outcome of one executed action: ok/error, URL before and after, and whether it tried to leave the app."
"browser.BrowserSession.__init__" = "Sets up one worker's session object (browser, config, worker number, signal buffers); the context starts in start()."
"browser.BrowserSession.close" = "Closes the worker's browser context."
"browser.BrowserSession.in_scope" = "Whether a URL belongs to the app under test (allowed origins); everything else is blocked."
"browser.BrowserSession._route" = "Network router: lets in-scope requests through and aborts the rest, so agents never reach the internet."
"browser.BrowserSession._wire" = "Attaches the implicit-oracle listeners (page errors, console, responses, failed requests, request tracking) to a page."
"browser.BrowserSession._record" = "v5 evidence layer (D58): adds one same-origin response to the network timeline (method, URL, status, type, content type, page; what a write sent) and starts reading its JSON body."
"browser.BrowserSession._grab_body" = "v5 evidence layer: reads a response's body in the background and stores the parsed JSON on its timeline record (at most 200 KB; otherwise marks why not)."
"browser.BrowserSession.net_mark" = "v5 evidence layer: the timeline's current sequence number, taken when a step begins."
"browser.BrowserSession.net_since" = "v5 evidence layer: the timeline records after a mark, i.e. one step's responses."
"browser.BrowserSession._on_request" = "Tracks an in-flight xhr/fetch/document request (used to wait until the app is quiet)."
"browser.BrowserSession._on_request_done" = "Marks a tracked request as finished."
"browser.BrowserSession._on_console" = "Console listener: fault-exposure markers become ground-truth records, console errors become `console_error` signals."
"browser.BrowserSession._on_response" = "Response listener: records the step's write requests (method, path, status) and turns any in-scope HTTP 5xx into an `http_5xx` signal."
"browser.BrowserSession._on_request_failed" = "Turns an in-scope request that failed (not one cancelled by navigation) into a `request_failed` signal."
"browser.BrowserSession.drain_signals" = "Returns and clears the implicit-oracle signals collected since the last call."
"browser.BrowserSession.settle" = "Waits after an action: network idle, then no request in flight for 300 ms (v3, D46), then a short pause."
"browser.BrowserSession.observe" = "Runs the in-page observation script and returns an Observation (retries if the page navigated mid-way)."
"browser.BrowserSession.storage_state" = "Cookies and localStorage of the worker's context: saved per step so the gate can replay from that session."
"browser.BrowserSession.goto" = "Opens a URL or app path, refusing out-of-scope addresses."
"browser.BrowserSession.execute" = "Performs one action (click, fill, clear, select, check, press, hover, navigate, back, reload) on an element id and settles."
"browser.BrowserSession._after" = "After an action: if the page left the app, goes back to the last in-scope page; returns the ActionResult."
"browser.BrowserSession.login" = "Scripted login for the non-LLM crawler (B0) from the app's login recipe; retries once (I40)."
"browser._short" = "First line of an exception message, trimmed, for traces."

