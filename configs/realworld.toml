# RealWorld / Conduit (apps/realworld). Development app for Phase 1.

[app]
name = "realworld"
# D61 evaluation truth (X5 profile accuracy, per-app-type recall, framework axis): set by the assistant from
# fault_families.md section 4, to be checked by the author
app_type = "Blog, social"
primitives = ["CRUD", "COLL", "REL", "QUERY", "ID", "SHARE"]
framework = "Angular"
base_url = "http://127.0.0.1:4100"
compose_dir = "apps/realworld"
health_path = "/api/tags"
reset_compose_args = ["exec", "-T", "db", "psql", "-q", "-U", "conduit", "-d", "conduit",
                      "-v", "ON_ERROR_STOP=1", "-c", "SELECT agentic_reset()"]
# Nothing in Conduit is destructive beyond the app's own data, which is reset per run.
blocked_text = []
# The crawler cannot log back in mid-run, so it never clicks logout.
crawler_avoid_text = ["logout", "log out"]
# One seeded account per worker (apps/realworld/backend/src/agentic/seed.ts).
account_template = { username = "worker{i:02d}", email = "worker{i:02d}@conduit.test", password = "conduit-test-pw" }

[app.login]
path = "/login"
fields = { "Email" = "{email}", "Password" = "{password}" }
submit = "Sign in"

[llm]
# Free tier first (see docs/00_research_plan.md section 12). Any OpenAI-compatible
# provider works: gemini | groq | openrouter | cerebras | openai | ollama.
provider = "gemini"
model = "gemini-3.5-flash-lite"   # 2.5-flash is closed to new keys; 3.8-flash timed out on 11 Oct
temperature = 0.2
max_output_tokens = 800
json_mode = true
min_interval_s = 6.5   # free tier is ~10 requests/minute
key_fallback = true
api_key_env = "GEMINI_API_KEY_OLD"   # 27 Oct Night 3 (h4rep): key _OLD from 21:00 (key 9 out of quota in b4 rep 4); key 9 from 09:27 (key 7 out of quota in b4 rep 2). 25 Oct Night 1 (h3rep): pin one key, rotate on 429 (D41): primary -> _1 -> _4 -> _5 -> _6 -> _7 -> _9 -> _10 -> _OLD
price_in = 0.0
price_out = 0.0

[budget]
max_steps = 300
max_minutes = 15
max_tokens = 1500000

[run]
seed = 1
headless = true
out_dir = "runs"
# v5 evidence layer (D58, D59): network timeline with JSON bodies, sent data of writes, transient
# messages (R57, R51). On from 28 Oct for every v5 run; runs and resweeps before D59 had it off.
capture_evidence = true
# D61: every v5 mechanism on for the pilots: environment replay (R71: time zones, locale, phone width; add
# "firefox", "webkit" after `playwright install firefox webkit`) and the measured-only coverage (R12, JS).
env_axes = ["tz-west", "tz-east", "locale", "phone"]
coverage_metrics = true
# D62a: rules left out of the v5.0 report (they still run; findings go to findings_withheld.json).
# Proposed set (D62a), switched on for the v5.0 candidate and its live pilots on 30 Oct:
exclude_rules = ["R02h", "R02m", "R09", "R09d", "R12c", "R21b", "R30", "R50m", "R65", "R68t"]
