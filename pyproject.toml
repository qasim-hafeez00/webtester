[project]
name = "webtester"
version = "0.1.0"
description = "Coordinated, evidence-gated LLM exploration for web application testing (AI4015 research prototype)"
requires-python = ">=3.12"
dependencies = [
  "playwright==1.58.0",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
webtester = "webtester.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs the Conduit stack running on 127.0.0.1:4100"]
